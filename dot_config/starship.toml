# ~/.config/starship.toml
"$schema" = 'https://starship.rs/config-schema.json'

add_newline   = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$python\
$golang\
$nodejs\
$rust\
$kubernetes\
$aws\
$cmd_duration\
$character"""

[character]
success_symbol = '[\$](bold green)'
error_symbol   = '[\$](bold red)'
vimcmd_symbol  = '[<](bold purple)'

[directory]
style             = 'bold blue'
truncation_length = 4
truncate_to_repo  = true
read_only         = ' [ro]'
read_only_style   = 'red'
format            = '[$path]($style)[$read_only]($read_only_style) '

[git_branch]
symbol = ''
style  = 'purple'
format = '[$branch(:$remote_branch)]($style) '

[git_status]
style      = 'yellow'
format     = '([$all_status$ahead_behind]($style) )'
ahead      = 'ahead:${count}'
behind     = 'behind:${count}'
diverged   = 'ahead:${ahead_count} behind:${behind_count}'
modified   = '!${count}'
untracked  = '?${count}'
staged     = '+${count}'
stashed    = '=\$'
deleted    = 'x${count}'
conflicted = '~${count}'

[git_state]
style  = 'red'
format = '\([$state( $progress_current/$progress_total)]($style)\) '

[golang]
symbol = 'go '
style  = 'blue'
format = '[$symbol($version)]($style) '

[nodejs]
symbol = 'node '
style  = 'green'
format = '[$symbol($version)]($style) '

[python]
symbol        = 'py '
style         = 'yellow'
format        = '[$symbol$pyenv_prefix($version)(\($virtualenv\))]($style) '
python_binary = ['python3', 'python']

[rust]
symbol = 'rs '
style  = 'red'
format = '[$symbol($version)]($style) '

[kubernetes]
disabled = false
symbol   = 'k8s '
style    = 'cyan'
format   = '[$symbol$context( \($namespace\))]($style) '

[aws]
disabled = false
symbol   = 'aws '
style    = 'yellow'
format   = '[$symbol($profile)(\[$region\])]($style) '

[cmd_duration]
min_time           = 3000
style              = 'dimmed white'
format             = '[took $duration]($style) '
show_notifications = false

[time]
disabled    = true

[package]
disabled = true

[docker_context]
disabled = true
