# ─────────────────────────────────────────────────────────────────────────────
#  ~/.config/starship.toml  —  Starship prompt (catppuccin mocha)
# ─────────────────────────────────────────────────────────────────────────────
"$schema" = 'https://starship.rs/config-schema.json'

add_newline   = true
command_timeout = 1000

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$python\
$golang\
$nodejs\
$rust\
$kubernetes\
$aws\
$cmd_duration\
$character"""

# ── Prompt character ──────────────────────────────────────────────────────────
[character]
success_symbol = '[❯](bold #a6e3a1)'
error_symbol   = '[❯](bold #f38ba8)'
vimcmd_symbol  = '[❮](bold #cba6f7)'

# ── Directory ─────────────────────────────────────────────────────────────────
[directory]
style             = 'bold #89b4fa'
truncation_length = 4
truncate_to_repo  = true
read_only         = ' 󰌾'
read_only_style   = '#f38ba8'
format            = '[$path]($style)[$read_only]($read_only_style) '

# ── Git ───────────────────────────────────────────────────────────────────────
[git_branch]
symbol = ' '
style  = '#cba6f7'
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
style     = '#f9e2af'
format    = '([$all_status$ahead_behind]($style) )'
ahead     = '⇡${count}'
behind    = '⇣${count}'
diverged  = '⇡${ahead_count}⇣${behind_count}'
modified  = '!${count}'
untracked = '?${count}'
staged    = '+${count}'
stashed   = '≡'
deleted   = '✘${count}'
conflicted = '=${count}'

[git_state]
style  = '#f38ba8'
format = '\([$state( $progress_current/$progress_total)]($style)\) '

# ── Languages (auto-detect from project files) ────────────────────────────────
[golang]
symbol = ' '
style  = '#89b4fa'
format = '[$symbol($version)]($style) '

[nodejs]
symbol = ' '
style  = '#a6e3a1'
format = '[$symbol($version)]($style) '

[python]
symbol           = ' '
style            = '#f9e2af'
format           = '[${symbol}${pyenv_prefix}(${version})(\($virtualenv\))]($style) '
python_binary    = ['python3', 'python']

[rust]
symbol = ' '
style  = '#fab387'
format = '[$symbol($version)]($style) '

# ── Cloud / infra ─────────────────────────────────────────────────────────────
[kubernetes]
disabled = false
symbol   = '☸ '
style    = '#89dceb'
format   = '[$symbol$context( \($namespace\))]($style) '

[aws]
disabled = false
symbol   = ' '
style    = '#fab387'
format   = '[$symbol($profile)(\[$region\])]($style) '

# ── Misc ──────────────────────────────────────────────────────────────────────
[cmd_duration]
min_time          = 3000
style             = '#585b70'
format            = '[ $duration]($style) '
show_notifications = false

[time]
disabled    = true
style       = '#585b70'
format      = '[$time]($style) '
time_format = '%H:%M'

# Disable noisy modules
[package]
disabled = true

[docker_context]
disabled = true
