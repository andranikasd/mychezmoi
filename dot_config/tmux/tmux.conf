# ─────────────────────────────────────────────────────────────────────────────
#  dotfiles/tmux/tmux.conf
# ─────────────────────────────────────────────────────────────────────────────

# ── Prefix: Ctrl+b ────────────────────────────────────────────────────────────
set -g prefix C-b
bind C-b send-prefix

# ── Terminal & Colors ─────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*:Tc"
# Undercurl + underline colour (neovim diagnostics, etc.)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# ── General Settings ──────────────────────────────────────────────────────────
set -g history-limit 50000
set -g display-time 3000
set -g status-interval 5
set -g focus-events on
set -sg escape-time 0          # no delay for escape key
set -g repeat-time 500
set -g base-index 1            # windows start at 1
setw -g pane-base-index 1      # panes start at 1
set -g renumber-windows on     # keep window numbers contiguous
set -g mouse on
set -g set-clipboard on
set -g default-shell /bin/bash

# Set the terminal window / tab title to the current session + window name
set -g set-titles on
set -g set-titles-string '#S · #W'

# Word separators for double-click selection (include common path chars)
setw -g word-separators ' @"=()[],`'

# ── Key Bindings ──────────────────────────────────────────────────────────────

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display '✓ tmux.conf reloaded'

# Split panes — open in current directory
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}" -p 25  # 25% bottom split

# New window in current directory
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Swap windows
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Alt+number to switch windows (no prefix needed)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6

# Alt+h/l to switch windows without prefix
bind -n M-h previous-window
bind -n M-l next-window

# Pane navigation without prefix — Alt+arrow
# Distinct from M-h/l (window switching) so both work intuitively.
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Clear screen (prefix + C-l) — useful when C-l is intercepted by tmux or vim
bind C-l send-keys C-l

# Quick session switcher
bind s choose-session -Z

# Last window / last session (toggle back)
bind C-b last-window
bind Tab last-window
bind BSpace switch-client -l

# Kill pane/window without confirmation prompt
bind x kill-pane
bind X kill-window
bind q confirm-before -p "Kill session? (y/n)" kill-session

# Sync panes toggle
bind = setw synchronize-panes \; display '#{?pane_synchronized,Sync ON,Sync OFF}'

# Zoom/unzoom pane
bind z resize-pane -Z

# Popups
bind g display-popup -d "#{pane_current_path}" -w 90% -h 85% -E 'bash'
bind G display-popup -d "#{pane_current_path}" -w 90% -h 85% -E 'lazygit'

# Fuzzy window/pane finder (requires fzf)
bind f run-shell "
  wins=\$(tmux list-windows -a -F '#S:#I #W')
  sel=\$(printf '%s\n' \"\$wins\" | fzf --height=40% --reverse --border=rounded \
      --color=bg:#1e1e2e,fg:#cdd6f4,hl:#89b4fa,bg+:#313244 \
      --prompt='  window > ' --pointer='▶')
  [[ -n \"\$sel\" ]] && tmux switch-client -t \"\${sel%% *}\"
"

# ── Copy Mode (vi) ────────────────────────────────────────────────────────────
setw -g mode-keys vi

bind Enter copy-mode
bind -T copy-mode-vi v      send -X begin-selection
bind -T copy-mode-vi V      send -X select-line
bind -T copy-mode-vi C-v    send -X rectangle-toggle
bind -T copy-mode-vi y      send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Y      send -X copy-pipe-and-cancel 'pbcopy; tmux paste-buffer'
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H      send -X start-of-line
bind -T copy-mode-vi L      send -X end-of-line

# Incremental search in copy-mode (type to narrow, like Vim /)
bind -T copy-mode-vi / command-prompt -i -p '(search ↓)' \
  'send -X search-forward-incremental "%%%"'
bind -T copy-mode-vi ? command-prompt -i -p '(search ↑)' \
  'send -X search-backward-incremental "%%%"'

# ── Status Bar ────────────────────────────────────────────────────────────────
#  Position : bottom
#  Left     : mauve session badge → powerline arrow
#  Windows  : inactive dim · active blue pill with powerline arrows
#  Right    : PREFIX/COPY flags · cwd · bold time
# ─────────────────────────────────────────────────────────────────────────────
set -g status on
set -g status-position       bottom
set -g status-style          "bg=#1e1e2e"
set -g status-left-length    40
set -g status-right-length   90

# Left — session badge (mauve bg, dark fg) + powerline right arrow
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold]  #S #[bg=#1e1e2e,fg=#cba6f7,none] "

# Windows — inactive: muted · active: blue background with powerline arrows
set -g window-status-format          "#[fg=#45475a,bg=#1e1e2e] #I #[fg=#585b70]#W "
set -g window-status-current-format  "#[fg=#1e1e2e,bg=#89b4fa,bold] #I #W#{?window_zoomed_flag, ⬣,}#{?#{>:#{window_panes},1}, +#{window_panes},} #[fg=#89b4fa,bg=#1e1e2e,none] "
set -g window-status-separator       ""
set -g window-status-activity-style  "fg=#f9e2af,bg=#1e1e2e"
set -g window-status-bell-style      "fg=#f38ba8,bg=#1e1e2e,bold"

# Right — PREFIX/COPY (colored badges) · cwd · time
set -g status-right "#{?client_prefix,#[fg=#1e1e2e,bg=#f38ba8,bold]  PREFIX #[bg=#1e1e2e,fg=#f38ba8,none] ,}#{?pane_in_mode,#[fg=#1e1e2e,bg=#a6e3a1,bold]  COPY #[bg=#1e1e2e,fg=#a6e3a1,none] ,}#[fg=#585b70]#{b:pane_current_path}  #[fg=#45475a]│ #[fg=#a6adc8,bold]%H:%M "

# Pane borders
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"
set -g pane-border-lines        single
# Show current command per pane — auto-hide when only one pane in window
setw -g pane-border-format '#{?pane_active,#[fg=#cba6f7],#[fg=#585b70]} #{pane_index} #{pane_current_command} '
set-hook -g window-layout-changed \
  'set-option -wF pane-border-status "#{?#{==:#{window_panes},1},off,top}"'

# Pane number display
set -g display-panes-colour        "#585b70"
set -g display-panes-active-colour "#cba6f7"

# Messages
set -g message-style         "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#f9e2af"

# Clock
setw -g clock-mode-colour "#89b4fa"

# ── Plugins via TPM ───────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'    # persist sessions across restart
set -g @plugin 'tmux-plugins/tmux-continuum'    # auto-save every 15 min
set -g @plugin 'tmux-plugins/tmux-yank'         # better clipboard integration
set -g @plugin 'tmux-plugins/tmux-open'         # open URLs/files from copy mode (o / C-o)
set -g @plugin 'sainnhe/tmux-fzf'               # prefix+F: fzf sessions/windows/panes/procs

# Plugin settings
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @yank-action 'copy-pipe-no-clear'
# tmux-open: use nvim to open files from copy mode with C-o
set -g @open-editor 'nvim'
# tmux-fzf: use F (capital) so it doesn't clash with our lowercase f binding
TMUX_FZF_LAUNCH_KEY='F'

# Initialize TPM (keep at bottom)
run '~/.tmux/plugins/tpm/tpm'